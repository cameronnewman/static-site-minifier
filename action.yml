name: 'Static Site Minifier'
description: >-
  Minify a static site (HTML, CSS, JS) using a prebuilt
  static-site-minifier binary downloaded from GitHub releases.
author: 'aanantaco'
branding:
  icon: 'minimize-2'
  color: 'blue'

inputs:
  version:
    description: >-
      Release tag to download (for example v0.3.1-abc1234), or "latest"
      for the newest release.
    required: false
    default: 'latest'
  src:
    description: 'Source directory to minify.'
    required: false
    default: 'src'
  dest:
    description: 'Destination directory for the minified site.'
    required: false
    default: 'dist'

outputs:
  version:
    description: 'The release tag the binary was downloaded from.'
    value: ${{ steps.download.outputs.version }}

runs:
  using: 'composite'
  steps:
    - name: Download builder binary
      id: download
      shell: bash
      env:
        SSM_VERSION: ${{ inputs.version }}
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail

        case "$(uname -s)" in
          Linux) os=linux ;;
          Darwin) os=darwin ;;
          MINGW*|MSYS*|CYGWIN*) os=windows ;;
          *) echo "unsupported OS: $(uname -s)" >&2; exit 1 ;;
        esac
        case "$(uname -m)" in
          x86_64|amd64) arch=amd64 ;;
          aarch64|arm64) arch=arm64 ;;
          armv7l|armv6l|arm) arch=arm ;;
          *) echo "unsupported architecture: $(uname -m)" >&2; exit 1 ;;
        esac

        asset="builder-${os}-${arch}"
        if [ "$os" = "windows" ]; then asset="${asset}.exe"; fi

        repo="aanantaco/static-site-minifier"
        if [ "$SSM_VERSION" = "latest" ]; then
          # Resolve the "latest" redirect to a concrete release URL so
          # the tag actually used can be reported as an output. The
          # release marked "latest" may carry no binaries (for example
          # a release published on the moving v1 tag): then the probe
          # fails and we fall back to the newest release that has this
          # asset.
          probe="https://github.com/${repo}/releases/latest/download/${asset}.tar.gz"
          url=$(curl -fsI --retry 3 --retry-delay 2 "$probe" \
            | tr -d '\r' | awk 'tolower($1) == "location:" { print $2; exit }') || url=""
          case "$url" in
            *"/releases/download/"*) ;;
            *) url="" ;;
          esac
          # The redirect is issued even for assets the latest release
          # does not have, so verify the concrete URL actually exists.
          if [ -n "$url" ] && ! curl -fsIL --retry 3 --retry-delay 2 "$url" -o /dev/null; then
            url=""
          fi
          if [ -z "$url" ]; then
            echo "latest release has no ${asset}.tar.gz; checking recent releases"
            # Authenticate when a token is available: unauthenticated
            # api.github.com calls from shared Actions runner IPs are
            # rate limited and fail intermittently with 403.
            auth=()
            if [ -n "${GH_TOKEN:-}" ]; then
              auth=(-H "Authorization: Bearer ${GH_TOKEN}")
            fi
            url=$(curl -fsSL --retry 3 --retry-delay 2 "${auth[@]}" \
              "https://api.github.com/repos/${repo}/releases?per_page=15" \
              | grep -o "https://github.com/${repo}/releases/download/[^\"]*/${asset}\.tar\.gz" \
              | head -n 1)
            if [ -z "$url" ]; then
              echo "no recent release contains ${asset}.tar.gz" >&2
              exit 1
            fi
          fi
        else
          url="https://github.com/${repo}/releases/download/${SSM_VERSION}/${asset}.tar.gz"
        fi

        resolved="${url%/*}"
        resolved="${resolved##*/}"
        echo "Resolved release: ${resolved}"
        echo "version=${resolved}" >> "$GITHUB_OUTPUT"

        dir="${RUNNER_TEMP}/static-site-minifier"
        mkdir -p "$dir"
        echo "Downloading $url"
        curl -fsSL --retry 3 --retry-delay 2 "$url" -o "$dir/${asset}.tar.gz"
        tar -xzf "$dir/${asset}.tar.gz" -C "$dir"

        bin="$dir/builder"
        if [ "$os" = "windows" ]; then bin="${bin}.exe"; fi
        mv "$dir/${asset}" "$bin"
        chmod +x "$bin"
        echo "SSM_BIN=$bin" >> "$GITHUB_ENV"
        "$bin" version

    - name: Minify site
      shell: bash
      env:
        SRC_DIR: ${{ inputs.src }}
        DEST_DIR: ${{ inputs.dest }}
      run: '"$SSM_BIN" build'
